  const voices=window.speechSynthesis.getVoices();
  const english=voices.filter(v=>/^en([-_]|$)/i.test(v.lang));
  const us=english.filter(v=>/^en[-_]US$/i.test(v.lang));

  speechSynthesis.speak(u);
}
