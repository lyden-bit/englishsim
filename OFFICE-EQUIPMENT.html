function render(){let x=LESSONS[current];$('scene').src=x.img;$('scene').alt='3D cartoon: '+x.en;$('scene').style.animation='none';void $('scene').offsetWidth;$('scene').style.animation='sceneIn .45s ease-out';$('en').textContent=x.en;$('vi').textContent=x.vi;$('example').innerHTML='<div class="example-en">'+x.example+'</div><div class="example-vi">'+x.translation+'</div>';$('pos').textContent=(current+1)+' of '+LESSONS.length;$('count').textContent=(current+1)+' / '+LESSONS.length;document.querySelectorAll('.entry').forEach((b,i)=>{b.classList.toggle('active',i===current);b.setAttribute('aria-current',i===current?'true':'false')});$('prev').disabled=current===0;$('prev').style.opacity=current===0?'.5':'1';$('next').textContent=current===LESSONS.length-1?'Start again ↻':'Next ❯'}LESSONS.forEach((x,i)=>{let b=document.createElement('button');b.className='entry';b.innerHTML='<span class="number">'+(i+1)+'</span><img class="thumb" alt="" src="'+x.img+'"><span>'+x.en+'</span>';b.onclick=()=>{current=i;render()};$('entries').appendChild(b)});$('prev').onclick=()=>{if(current>0){current--;render()}};$('next').onclick=()=>{current=(current+1)%LESSONS.length;render()};$('speak').onclick=()=>speak(LESSONS[current].en);$('slowExample').onclick=()=>speak(LESSONS[current].example, .48, 'male');$('fastExample').onclick=()=>speak(LESSONS[current].example, 1.08, 'female');document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});render();</script></body></html>
