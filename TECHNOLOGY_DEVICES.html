  const voices=window.speechSynthesis.getVoices();
  const english=voices.filter(v=>/^en([-_]|$)/i.test(v.lang));
  const us=english.filter(v=>/^en[-_]US$/i.test(v.lang));
  const pool=us.length?us:english;
  // Browser voices do not expose age or gender as guaranteed metadata.
  // Prefer recognizably masculine/feminine US-English voice names when installed.
  const male=['Guy','Andrew','Eric','Brian','Christopher','David','Mark','Ryan','Daniel','Alex','Aaron','Matthew','James'];
  const female=['Jenny','Aria','Samantha','Zira','Ava','Emma','Sonia','Michelle','Ana','Allison','Victoria','Susan'];
  const names=gender==='male'?male:female;
  const matching=pool.filter(v=>names.some(n=>new RegExp('\\b'+n+'\\b','i').test(v.name)));
  const natural=v=>/natural|neural|enhanced|premium|online/i.test(v.name);
  return matching.find(natural)||matching[0]||pool.find(natural)||pool[0]||null;
}
function speak(t,rate=.82,gender='female'){
  if(!window.speechSynthesis){alert('Trình duyệt không hỗ trợ phát âm.');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang='en-US';u.rate=rate;u.pitch=gender==='male'?.94:1.15;u.volume=1;
  const voice=chooseVoice(gender);if(voice)u.voice=voice;
  speechSynthesis.speak(u);
}
